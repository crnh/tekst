baseURL = "https://tekst.haasj.es/"
locale = "en-us"
defaultContentLanguage = "en-us"
title = "Tekst"

[module]
[module.hugoVersion]
extended = false
min = "0.160.0"

# Default config
[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[params]
paginationSize = 100

[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "Home"

[params.json-ld]
posts = { page = "blog-posting", section = "collection-page" }
publications = { page = "scholarly-article", section = "collection-page" }

[menus]
[[menus.main]]
name = "setup"
pageRef = "/setup"
weight = 10

[[menus.main]]
name = "features"
pageRef = "/features"
weight = 20
